<!DOCTYPE html>
<html>
<head>
	<!-- Basic Page Info -->
	<meta charset="utf-8">
	<title>BACK-OFFICE - POSKOO</title>

	<!-- Site favicon -->

	<link rel="icon" type="image/png" sizes="32x32" href="vendors/images/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="vendors/images/favicon-16x16.png">-->

    <link rel="apple-touch-icon" sizes="180x180" href="{{url_for('static', filename='vendors/images/apple-touch-icon.png')}}" rel="stylesheet" type="text/css">
    <link rel="icon" type="image/png" sizes="32x32" href="{{url_for('static', filename='vendors/images/favicon-32x32.png')}}" rel="stylesheet" type="text/css">
    <link rel="icon" type="image/png" sizes="16x16" href="{{url_for('static', filename='vendors/images/favicon-16x16.png')}}" rel="stylesheet" type="text/css">
    
	<!-- Mobile Specific Metas -->
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    
	<!-- Google Font -->
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
	<!-- CSS -->    
    <link rel="stylesheet" type="text/css" sizes="16x16" href="{{url_for('static', filename='vendors/styles/core.css')}}" rel="stylesheet" type="text/css">
    <link rel="stylesheet" type="text/css" sizes="16x16" href="{{url_for('static', filename='vendors/styles/icon-font.min.css')}}" rel="stylesheet" type="text/css">
    <link rel="stylesheet" type="text/css" sizes="16x16" href="{{url_for('static', filename='vendors/styles/style.css')}}" rel="stylesheet" type="text/css">
	
    
    <!-- Global site tag (gtag.js) - Google Analytics -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=UA-119386393-1"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag(){dataLayer.push(arguments);}
		gtag('js', new Date());

		gtag('config', 'UA-119386393-1');
	</script>
</head>
<body class="login-page">
	<div class="login-wrap d-flex align-items-center flex-wrap justify-content-center">
		<div class="container">
			<div class="row align-items-center">
				<div class="col-md-12 col-lg-12">
					<div class="login-box bg-white box-shadow border-radius-10">
						<!-- Afficher message d'erreur -->
						{% with messages = get_flashed_messages() %}
						{% if messages %}
							<div class="alert alert-danger alert-dismissible fade show btn-close" role="alert" data-bs-dismiss="alert" aria-label="Close">
								<strong style="color: black;">{{ messages[0] }}</strong>
							</div>
						{% endif %}
						{% endwith %}
						<div class="login-title">
							<h2 class="text-center text-primary">Connexion - Poskoo</h2>
						</div>
						<form action="/login" method="POST">
							<div class="input-group custom">
								<input type="email" name="email" class="form-control form-control-lg" placeholder="Email">
								<div class="input-group-append custom">
									<span class="input-group-text"><i class="icon-copy dw dw-user1"></i></span>
								</div>
							</div>
							<div class="input-group custom">
								<input type="password" name="password_hash" class="form-control form-control-lg" placeholder="Mot de passe">
								<div class="input-group-append custom">
									<span class="input-group-text"><i class="dw dw-padlock1"></i></span>
								</div>
							</div>
							<div class="row pb-30">
								<div class="col-6">
									<div class="custom-control custom-checkbox">
										
									</div>
								</div>
								<div class="col-6">
									<div class="forgot-password"><a href="forgot-password.html">Mot de passe oublié</a></div>
								</div>
							</div>
							<div class="row">
								<div class="col-sm-12">
									<div class="input-group mb-0">
										<!-- <a class="btn btn-primary btn-lg btn-block" href="/dashboard">Se connecter</a> -->
										<button class="btn btn-primary btn-lg btn-block">Se connecter</button>
									</div>
									
									<!-- <div class="input-group mb-0">
										<a class="btn btn-outline-primary btn-lg btn-block" href="register.html">Register To Create Account</a>
									</div> -->
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- js -->
    <script src="{{url_for('static', filename='vendors/scripts/core.js')}}"></script>
    <script src="{{url_for('static', filename='vendors/scripts/script.min.js')}}"></script>
    <script src="{{url_for('static', filename='vendors/scripts/process.js')}}"></script>
    <script src="{{url_for('static', filename='vendors/scripts/layout-settings.js')}}"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>


</body>
</html>
