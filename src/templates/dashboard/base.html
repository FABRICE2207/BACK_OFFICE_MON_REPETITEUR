<!DOCTYPE html>
<html>
<head>
	<!-- Basic Page Info -->
	<meta charset="utf-8">
	<title>BACK-OFFICE - POSKOO</title>

	<!-- Site favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="{{url_for('static', filename='vendors/images/logo_poskoo.jpg')}}" rel="stylesheet" type="text/css">
   

	<!-- Mobile Specific Metas -->
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

	<!-- Google Font -->
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
	<!-- CSS -->
    <link rel="stylesheet" type="text/css" sizes="16x16" href="{{url_for('static', filename='vendors/styles/core.css')}}" rel="stylesheet" type="text/css">
    <link rel="stylesheet" type="text/css" sizes="16x16" href="{{url_for('static', filename='vendors/styles/icon-font.min.css')}}" rel="stylesheet" type="text/css">
    <link rel="stylesheet" type="text/css" sizes="16x16" href="{{url_for('static', filename='vendors/styles/style.css')}}" rel="stylesheet" type="text/css">

    <style>
        .brand-logo a h3{
            color: white;
            font-weight: 900;
            margin: auto;
        }
    </style>
</head>
<body>

    <div class="header">
		<div class="header-left">
			<div class="menu-icon dw dw-menu"></div>
			<div class="search-toggle-icon dw dw-search2" data-toggle="header_search"></div>
			<div class="header-search">
				<form>
					<div class="form-group mb-0">
						<i class="dw dw-search2 search-icon"></i>
						<input type="text" class="form-control search-input" placeholder="Search Here">
						<div class="dropdown">
							<a class="dropdown-toggle no-arrow" href="#" role="button" data-toggle="dropdown">
								<i class="ion-arrow-down-c"></i>
							</a>
							<div class="dropdown-menu dropdown-menu-right">
								<div class="form-group row">
									<label class="col-sm-12 col-md-2 col-form-label">From</label>
									<div class="col-sm-12 col-md-10">
										<input class="form-control form-control-sm form-control-line" type="text">
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-12 col-md-2 col-form-label">To</label>
									<div class="col-sm-12 col-md-10">
										<input class="form-control form-control-sm form-control-line" type="text">
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-12 col-md-2 col-form-label">Subject</label>
									<div class="col-sm-12 col-md-10">
										<input class="form-control form-control-sm form-control-line" type="text">
									</div>
								</div>
								<div class="text-right">
									<button class="btn btn-primary">Search</button>
								</div>
							</div>
						</div>
					</div>
				</form>
			</div>
		</div>
		<div class="header-right">
			<div class="user-info-dropdown">
				<div class="dropdown" style="margin: 10px;">
					<a class="dropdown-toggle" href="#" role="button" data-toggle="dropdown">
						<span class="user-name">{{ first_name }} {{ last_name }}</span>
					</a>
					<div class="dropdown-menu dropdown-menu-right dropdown-menu-icon-list">
						<a class="dropdown-item" href="/profile"><i class="dw dw-user1"></i>Mon Profil</a>
                        {% if current_user.is_authenticated %}
						    <a class="dropdown-item" href="{{ url_for('auth.logout') }}"><i class="dw dw-logout"></i>Se déconnecter</a>
                        {% endif %}
					</div>
				</div>
			</div>
			<div class="github-link">
				<a href="https://github.com/dropways/deskapp" target="_blank"><img src="vendors/images/github.svg" alt=""></a>
			</div>
		</div>
	</div>

	<div class="left-side-bar">
		<div class="brand-logo text-center">
			<a href="/dashboard">
				<h3>POSKOO</h3>
			</a>
		</div>
		<div class="menu-block customscroll">
			<div class="sidebar-menu">
				<ul id="accordion-menu">
                    <li class="dropdown">
						<a href="/dashboard" class="dropdown-toggle">
							<span class="micon dw dw-house-1"></span><span class="mtext">DASHBOARD</span>
						</a>
					</li>
					<li class="dropdown">
						<a href="/liste_articles" class="dropdown-toggle">
							<span class="micon dw dw-house-1"></span><span class="mtext">Validation</span>
						</a>
						<!-- <ul class="submenu">
							<li><a href="/liste_articles">Liste des articles</a></li>
						</ul> -->
					</li>
					<!-- <li class="dropdown">
						<a href="/liste_categorie" class="dropdown-toggle">
							<span class="micon dw dw-edit2"></span><span class="mtext">Catégories</span>
						</a>
						<ul class="submenu">
							<li><a href="/liste_categorie">Liste des catégories</a></li>
						</ul>
					</li> -->
					<li class="dropdown">
						<a href="/liste_vendeurs" class="dropdown-toggle">
							<span class="micon dw dw-library"></span><span class="mtext">Vendeurs</span>
						</a>
						<!-- <ul class="submenu">
							<li><a href="/liste_vendeurs">Liste des vendeurs</a></li>
						</ul> -->
					</li>
					
				</ul>
			</div>
		</div>
	</div>
	<div class="mobile-menu-overlay"></div>

    <div class="main-container">

        {% block content %} {% endblock content %}

    </div>


    <!-- js -->
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
	
    <script src="{{url_for('static', filename='vendors/scripts/core.js')}}"></script>
    <script src="{{url_for('static', filename='vendors/scripts/script.min.js')}}"></script>
    <script src="{{url_for('static', filename='vendors/scripts/process.js')}}"></script>
    <script src="{{url_for('static', filename='vendors/scripts/layout-settings.js')}}"></script>
    <script src="{{url_for('static', filename='vendors/scripts/dashboard.js')}}"></script>

	<script src="{{url_for('static', filename='js/show_modal.js')}}"></script>
	<script src="{{url_for('static', filename='js/changerStatus.js')}}"></script>

</body>
</html>
